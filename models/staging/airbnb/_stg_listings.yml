models:
  - name: stg_listings
    description: Staged listings data from Airbnb in Berlin. One row per listing.
    columns:
      - name: listing_id
        description: Primary key for listings
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: Key for the host of the listing. A host can have several listings.
        data_tests:
          - not_null

      - name: host_listing_count
        description: Count of listings per host_id
        data_tests:
          - not_null

      - name: district
        description: List of available districts in Berlin
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "Charlottenburg-Wilm.",
                    "Friedrichshain-Kreuzberg",
                    "Tempelhof - Schöneberg",
                    "Lichtenberg",
                    "Steglitz - Zehlendorf",
                    "Spandau",
                    "Mitte",
                    "Pankow",
                    "Treptow - Köpenick",
                    "Reinickendorf",
                    "Marzahn - Hellersdorf",
                    "Neukölln",
                  ]

      - name: host_size_band
        description: Band of the host's listing count (1, 2-4, 5-9, 10+)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1", "2-4", "5-9", "10+"]

      - name: license_type
        description: >
          Type of license value, derived from the free-text license column. The raw license is not kept.
          Rules are checked in this order and the first match wins: missing (null or empty),
          exempt (starts with "exempt"), registration number (the whole value matches the Berlin
          format NN/A/AA/NNNNNN-NN, case-insensitive), legal entity and private individual (value starts
          with the host template text), other (everything else, e.g. placeholders and typos).
          "registration number" only means the format is right. It is not checked against the Berlin register.
          A value that has template text and also a registration-format number inside it is not matched
          by the whole-value rule, so it stays in legal entity or private individual.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "missing",
                    "exempt",
                    "registration number",
                    "legal entity",
                    "private individual",
                    "other",
                  ]
